[project]
site_name = "Votr"
repo_url = "https://github.com/fmfi-svt/votr"
repo_name = "fmfi-svt/votr"
extra_css = ["extra.css"]
exclude_docs = """
griffe_ext.py
*.pyc
"""

[project.markdown_extensions]
# Convert dashes and ellipses, but not quotes (bad for copy pasting).
smarty = { smart_quotes = false }

# Boilerplate taken from the default template generated by `zensical new`.
# Only `toc.permalink`, `pymdownx.highlight`, and `pymdownx.magiclink` have any
# effect on our output.
abbr = {}
admonition = {}
attr_list = {}
def_list = {}
footnotes = {}
md_in_html = {}
toc.permalink = true
pymdownx.arithmatex.generic = true
pymdownx.betterem = {}
pymdownx.caret = {}
pymdownx.details = {}
pymdownx.emoji.emoji_generator = "zensical.extensions.emoji.to_svg"
pymdownx.emoji.emoji_index = "zensical.extensions.emoji.twemoji"
pymdownx.highlight.anchor_linenums = true
pymdownx.highlight.line_spans = "__span"
pymdownx.highlight.pygments_lang_class = true
# pymdownx.inlinehilite = {} # Skip because it messes up aisikl.operations TOC.
pymdownx.keys = {}
pymdownx.magiclink = {}
pymdownx.mark = {}
pymdownx.smartsymbols = {}
# pymdownx.snippets.base_path = "includes"
pymdownx.superfences.custom_fences = [
  { name = "mermaid", class = "mermaid", format = "pymdownx.superfences.fence_code_format" },
]
pymdownx.tabbed.alternate_style = true
pymdownx.tabbed.combine_header_slug = true
pymdownx.tasklist.custom_checkbox = true
pymdownx.tilde = {}

[project.plugins.api-autonav]
modules = ["aisikl", "fladgejt", "votrfront"]
exclude = [
  # Skip empty __init__.py files (sadly they must be explicitly listed).
  "re:^(aisikl|fladgejt|votrfront)$",
  # Skip local_settings (too local).
  "votrfront.local_settings",
]

[project.plugins.mkdocstrings.handlers.python]
paths = ["."]
inventories = [
  "https://docs.python.org/3/objects.inv",
  "https://markupsafe.palletsprojects.com/en/stable/objects.inv",
  "https://pydantic.dev/docs/httpx2/objects.inv", # very bare-bones :(
  "https://starlette.dev/objects.inv", # extremely bare-bones :(
  "https://www.crummy.com/software/BeautifulSoup/bs4/doc/objects.inv",
]

[project.plugins.mkdocstrings.handlers.python.options]
extensions = ["griffe_inherited_docstrings", "docs/griffe_ext.py"]
separate_signature = true
show_signature_annotations = true
show_source = false
show_symbol_type_heading = true
show_symbol_type_toc = true
signature_crossrefs = true

# From https://mkdocstrings.github.io/python/usage/#recommended-settings
# But "table" looks nice too.
docstring_section_style = "list"

# Docstring syntax:
docstring_style = "google"
scoped_crossrefs = true

# Just for elegance. No difference on our output.
allow_inspection = false

# Give griffe_ext.py full control over what to show.
filters = "public"
show_if_no_docstring = true

# Give griffe_ext.py full control over ordering.
members_order = [] # undocumented :/
group_by_category = false

[project.plugins.offline]

[project.theme]
features = [
  "navigation.indexes",
  "search.highlight",
  "toc.follow",
]
