[project]
name = "votr"
version = "0.0.0"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "beautifulsoup4>=0",
    "lxml>=0",
    "monkeytype",
    "requests>=0",
]

[dependency-groups]
votrfront = [
    "markupsafe>=0",
    "werkzeug>=0",
]
prod = [
    "gunicorn[setproctitle]>=0",
    "python3-saml>=0",
    # Old setuptools are needed because our version of gunicorn still depends on
    # pkg_resources. TODO: Update gunicorn and remove this dependency.
    "setuptools<82",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.coverage.run]
branch = true
parallel = true
relative_files = true
source = ["."]
omit = [".venv/*"]

[tool.coverage.html]
extra_css = "coverage_extra.css"

[tool.hatch.build]
include = ["aisikl", "fladgejt"]

[tool.uv]
default-groups = ["votrfront"]

[tool.uv.sources]
gunicorn = { git = "https://github.com/TomiBelan/gunicorn" }
monkeytype = { git = "https://github.com/jevinskie/MonkeyType", branch = "jev/orig/feat/py312" }
