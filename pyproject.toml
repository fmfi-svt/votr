[project]
name = "votr"
version = "0.0.0"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "beautifulsoup4>=0",
    "httpx2>=0",
    "lxml>=0",
]

[dependency-groups]
dev = [
    "pyrefly>=0",
    "watchdog>=0",
]
prod = [
    "python3-saml>=0",
]
votrfront = [
    "anycorn>=0",
    "markupsafe>=0",
    "python-multipart>=0", # optional dependency for starlette; not used directly
    "starlette>=0",
    "trio>=0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.basedpyright]
include = ["aisikl", "fladgejt", "tests"]
# Disabled for being too annoying.
reportExplicitAny = "none"
reportImportCycles = "none"
reportUnusedParameter = "hint"
# Would be good if you could mark functions where it's ok.
reportUnusedCallResult = "none"
# Has some value, but too verbose. Maybe worth checking once in a while.
reportAny = "none"
# Maybe later?
reportImplicitStringConcatenation = "none"
# Docs recommend one or the other. reportUnannotatedClassAttribute is enabled by
# default, for performance reasons, but they're equally fast/slow on our code.
# reportIncompatibleUnannotatedOverride is less annoying.
# See https://docs.basedpyright.com/latest/benefits-over-pyright/new-diagnostic-rules/#reportunannotatedclassattribute
# and https://docs.basedpyright.com/latest/benefits-over-pyright/new-diagnostic-rules/#reportincompatibleunannotatedoverride
reportUnannotatedClassAttribute = "none"
reportIncompatibleUnannotatedOverride = "warning"

[tool.coverage.run]
branch = true
parallel = true
relative_files = true
source = ["."]
omit = [".venv/*"]

[tool.coverage.html]
extra_css = "coverage_extra.css"

[tool.hatch.build]
include = ["aisikl", "fladgejt"]

[tool.pyrefly]
preset = "strict"
project-includes = ["aisikl/**/*.py*", "fladgejt/**/*.py", "tests/**/*.py"]

[tool.uv]
default-groups = ["votrfront"]
exclude-dependencies = [
    "rich-click", # kind of big, and only needed by anycorn's CLI
]
