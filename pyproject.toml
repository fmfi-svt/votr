[project]
name = "votr"
version = "0.0.0"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "beautifulsoup4>=0",
    "httpx2>=0",
    "lxml>=0",
]

[dependency-groups]
dev = [
    "pyrefly>=0",
    "ruff>=0",
    "watchdog>=0",
]
prod = [
    "python3-saml>=0",
]
votrfront = [
    "anycorn>=0",
    "markupsafe>=0",
    "python-multipart>=0", # optional dependency for starlette; not used directly
    "starlette>=0",
    "trio>=0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.basedpyright]
include = ["aisikl", "fladgejt", "formatter.py", "nbenv.py", "tests", "votrfront"]
# Disabled for being too annoying.
reportExplicitAny = "none"
reportImportCycles = "none"
reportUnusedParameter = "hint"
# Would be good if you could mark functions where it's ok.
reportUnusedCallResult = "none"
# Has some value, but too verbose. Maybe worth checking once in a while.
reportAny = "none"
# Maybe later?
reportImplicitStringConcatenation = "none"
# Docs recommend one or the other. reportUnannotatedClassAttribute is enabled by
# default, for performance reasons, but they're equally fast/slow on our code.
# reportIncompatibleUnannotatedOverride is less annoying.
# See https://docs.basedpyright.com/latest/benefits-over-pyright/new-diagnostic-rules/#reportunannotatedclassattribute
# and https://docs.basedpyright.com/latest/benefits-over-pyright/new-diagnostic-rules/#reportincompatibleunannotatedoverride
reportUnannotatedClassAttribute = "none"
reportIncompatibleUnannotatedOverride = "warning"

[tool.coverage.run]
branch = true
parallel = true
relative_files = true
source = ["."]
omit = [".venv/*"]

[tool.coverage.html]
extra_css = "coverage_extra.css"

[tool.hatch.build]
include = ["aisikl", "fladgejt"]

[tool.pyrefly]
preset = "strict"
project-includes = ["aisikl/**/*.py", "fladgejt/**/*.py", "formatter.py", "nbenv.py", "tests/**/*.py", "votrfront/**/*.py"]

[tool.ruff]
line-length = 80

[tool.ruff.lint.isort]
# Ruff warns this should be the same as skip-magic-trailing-comma (below).
split-on-trailing-comma = false

[tool.ruff.format]
# Various improvements, especially "hug_parens_with_braces_and_square_brackets".
# TODO: Let's try removing this when it stabilizes.
preview = true
# It's needed for formatter.py idempotence in some edge cases, such as
#   https://gist.github.com/TomiBelan/3262c9583f9e5d31a3c7c20e7f6dcba6
# On our codebase, its effects are mostly tolerable and occasionally positive
# (there really were a few stray commas).
skip-magic-trailing-comma = true

[tool.uv]
default-groups = ["votrfront"]
exclude-dependencies = [
    "rich-click", # kind of big, and only needed by anycorn's CLI
]

[tool.uv.sources]
# TODO: Remove once they release a new version. https://github.com/SAML-Toolkits/python3-saml/issues/446
python3-saml = { git = "https://github.com/SAML-Toolkits/python3-saml" }
